<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>輪 — 体・脳・心・魂</title>
<style>
:root{
  color-scheme:dark;
  --bg:#08090b; --panel:rgba(20,18,17,.62); --line:rgba(215,194,155,.18);
  --text:#e7dfd1; --muted:#8a8478; --gold:#c5a568;
  --physical:#d0906a; --brain:#7fb2cf; --mind:#a48fd6; --soul:#e2bd68;
  --accent:var(--gold);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;min-height:100svh;overflow-x:hidden;
  background:radial-gradient(ellipse at 35% 40%,#171412 0%,#0c0b0c 45%,#08090b 80%)}
button,input{font:inherit;color:inherit}
.grain{position:fixed;inset:-50%;opacity:.07;pointer-events:none;z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");
  animation:grain .25s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(2%,-1%)}100%{transform:translate(-1%,2%)}}

.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:24px clamp(16px,3vw,40px) 40px}

/* ── header & tabs ── */
header{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;font-size:20px;letter-spacing:.3em}
.brand .sigil{color:var(--gold)}
nav{display:flex;flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:4px;background:var(--panel);backdrop-filter:blur(8px);overflow-x:auto}
.tab{flex:1;min-width:max-content;border:0;background:none;padding:10px 18px;border-radius:999px;cursor:pointer;
  letter-spacing:.2em;font-size:13px;color:var(--muted);transition:color .25s,background .25s}
.tab small{display:block;font-size:10px;letter-spacing:.15em;opacity:.7;margin-top:2px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:#120f0c;background:var(--accent)}

/* ── layout ── */
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.left,.right{display:flex;flex-direction:column;gap:22px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;backdrop-filter:blur(8px)}
.card h2{margin:0 0 14px;font-size:12px;font-weight:normal;letter-spacing:.3em;color:var(--muted)}

/* ── circle stage ── */
.stage{position:relative;aspect-ratio:1;width:100%;max-width:620px;margin:0 auto}
/* 画像の蛇の輪は中心が右下寄りなので、輪の中心がステージ中心に来るようにずらす */
.stage img{position:absolute;left:-2%;top:-6.5%;width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;opacity:.92;
  -webkit-mask-image:radial-gradient(circle at 52% 56%,#000 64%,transparent 76%);mask-image:radial-gradient(circle at 52% 56%,#000 64%,transparent 76%);
  animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.985) rotate(-.4deg)}50%{transform:scale(1.015) rotate(.4deg)}}
.stage svg.rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke-width:1;opacity:.3;cursor:pointer;transition:opacity .35s,stroke-width .35s}
.ring-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer;pointer-events:stroke}
.ring.on{opacity:1;stroke-width:2.6;filter:drop-shadow(0 0 4px currentColor)}
.ring-label{font-size:5px;letter-spacing:.35em;fill:var(--muted);transition:fill .3s;pointer-events:none}
.ring-label.on{fill:var(--text)}
.mark{fill:none;stroke:var(--gold);stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round;opacity:.55;animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:.85}}
.stage-score{position:absolute;left:0;right:0;bottom:-6px;text-align:center;font-size:12px;letter-spacing:.25em;color:var(--muted)}
.stage-score b{color:var(--accent);font-weight:normal;font-size:20px;letter-spacing:.05em}

/* ── item list ── */
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.item{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;cursor:pointer;border:1px solid transparent;transition:background .2s,border-color .2s}
.item:hover{background:rgba(255,255,255,.03)}
.item[aria-current="true"]{border-color:var(--line);background:rgba(255,255,255,.05)}
.item .name{font-size:15px;letter-spacing:.12em}
.item .name small{display:block;font-size:10px;color:var(--muted);letter-spacing:.2em;margin-top:2px}
.item .bar{grid-column:2/4;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.item .bar i{display:block;height:100%;background:var(--accent);transition:width .5s}
.item .val{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:42px;height:42px;grid-row:span 2}
.dot circle{fill:none}

/* ── radar ── */
.radar{width:100%;max-width:360px;display:block;margin:0 auto;overflow:visible}
.radar .web{fill:none;stroke:var(--line)}
.radar .axis{stroke:var(--line)}
.radar .shape{fill:var(--accent);fill-opacity:.18;stroke:var(--accent);stroke-width:1.5;transition:all .5s}
.radar text{font-size:9px;fill:var(--muted);letter-spacing:.12em}

/* ── detail ── */
.detail-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.detail-head h3{margin:0;font-size:26px;font-weight:normal;letter-spacing:.2em}
.detail-head span{color:var(--muted);font-size:12px;letter-spacing:.2em}
.detail p{color:#b9b0a1;font-size:14px;line-height:1.8;margin:10px 0 16px}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:8px;border-bottom:1px solid var(--line)}
.bars div{flex:1;position:relative;height:100%;display:flex;align-items:flex-end}
.bars i{display:block;width:100%;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;min-height:2px;transition:height .4s}
.bars i.empty{background:rgba(255,255,255,.06);opacity:1}
.bars div.today i{opacity:1;box-shadow:0 0 10px var(--accent)}
.bar-days{display:flex;gap:5px;margin-top:6px}
.bar-days span{flex:1;text-align:center;font-size:9px;color:var(--muted)}
.record{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.record label{font-size:12px;letter-spacing:.2em;color:var(--muted)}
.record input[type=range]{flex:1;min-width:140px;accent-color:var(--accent)}
.record output{width:2ch;text-align:right;font-size:20px;color:var(--accent)}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:8px 18px;cursor:pointer;letter-spacing:.15em;font-size:12px;transition:background .2s}
.btn:hover{background:rgba(197,165,104,.2)}
.btn.primary{background:var(--accent);color:#120f0c;border-color:transparent}
.saved{font-size:12px;color:var(--accent);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

footer{margin-top:28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;letter-spacing:.2em}
footer .actions{display:flex;gap:8px}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  header{gap:14px}
  nav{flex-basis:100%}
  .tab{padding:9px 12px;font-size:12px;letter-spacing:.12em}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="brand"><span class="sigil">✳</span><span>輪</span></div>
    <nav role="tablist" aria-label="層" id="tabs"></nav>
  </header>

  <div class="grid">
    <div class="left">
      <div class="stage" id="stage">
        <img src="assets/ouroboros.jpg" alt="自分の尾を噛む蛇の輪">
        <svg class="rings" viewBox="0 0 200 200" id="rings" aria-hidden="false"></svg>
        <div class="stage-score" id="stageScore"></div>
      </div>
      <section class="card detail" id="detail" aria-live="polite"></section>
    </div>

    <div class="right">
      <section class="card">
        <h2 id="listTitle">LAYERS</h2>
        <ul class="items" id="items"></ul>
      </section>
      <section class="card">
        <h2>BALANCE</h2>
        <svg class="radar" id="radar" viewBox="-40 -30 280 260"></svg>
      </section>
    </div>
  </div>

  <footer>
    <span>私の主人は私だ。</span>
    <span class="actions">
      <button class="btn" id="sample" type="button">サンプルを入れる</button>
      <button class="btn" id="clear" type="button">記録を消す</button>
    </span>
  </footer>
</div>

<script>
/* ───────── 定義 ───────── */
const LAYERS = [
  { id:'physical', en:'PHYSICAL', ja:'体', r:66, color:'--physical',
    desc:'器としての体。毎日の手入れが、意志を運ぶ力になる。',
    items:[
      ['skin','SKIN','肌','肌の調子。乾燥・荒れ・艶を 0〜10 で。'],
      ['eye','EYE','目','目の疲れ。画面を見続けた日は低めに。'],
      ['nose','NOSE','鼻','鼻・呼吸の通り。季節の変わり目に注意。'],
      ['weight','WEIGHT','体重','体重・体型への納得度。数字より感覚で。'],
      ['sleep','SLEEP','睡眠','眠りの深さと長さ。'],
      ['move','MOVE','運動','体を動かせたか。歩いただけでも数える。'],
    ]},
  { id:'brain', en:'BRAIN', ja:'脳', r:52, color:'--brain',
    desc:'考える装置。入力と整理の質がここに出る。',
    items:[
      ['focus','FOCUS','集中','ひとつのことに没頭できた度合い。'],
      ['learn','LEARN','学び','新しく覚えたこと・実機で試したこと。'],
      ['read','READ','読書','読んだ量と、残った手応え。'],
      ['create','CREATE','創造','何かを作った・書いた・描いた。'],
      ['clear','CLEAR','明晰','頭の霧の少なさ。'],
    ]},
  { id:'mind', en:'MIND', ja:'心', r:38, color:'--mind',
    desc:'揺れるもの。揺れを消すのではなく、見えるようにする。',
    items:[
      ['mood','MOOD','気分','今日の全体的な気分。'],
      ['calm','CALM','平静','落ち着き。焦り・苛立ちが少ないほど高く。'],
      ['drive','DRIVE','意欲','やろうと思えた力。'],
      ['bond','BOND','つながり','人との関わりの心地よさ。'],
      ['rest','REST','余白','休めたか、余裕があったか。'],
    ]},
  { id:'soul', en:'SOUL', ja:'魂', r:24, color:'--soul',
    desc:'自分の頭で考え、自分の意志で選んだか。紙の神ではなく、自分の神に従えたか。',
    items:[
      ['will','WILL','意志','自分で決めて、自分で引き受けたか。'],
      ['free','FREE','自由','他人の物差しに縛られなかったか。'],
      ['border','BORDER','境界線','自分と他人の線を守れたか。'],
      ['meaning','MEANING','意味','大切にしたいものに時間を使えたか。'],
      ['thanks','THANKS','感謝','ありがたいと思えたこと。'],
    ]},
];
const ITEMS = {};
LAYERS.forEach(L => L.items = L.items.map(([id,en,ja,desc]) => (ITEMS[id] = {id,en,ja,desc,layer:L})));

/* ───────── 保存 ───────── */
const KEY = 'wa.records.v1';
let records = {};
try { records = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { records = {}; }
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(records)); } catch {} };

const dayKey = d => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0,10); };
const TODAY = dayKey(new Date());
const lastDays = n => Array.from({length:n}, (_,i) => { const d = new Date(); d.setDate(d.getDate() - (n-1-i)); return dayKey(d); });

const latest = id => {
  const r = records[id]; if (!r) return null;
  const k = Object.keys(r).sort().pop(); return k ? r[k] : null;
};
const avg = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
const layerScore = L => avg(L.items.map(i => latest(i.id)));
const fmt = v => v == null ? '—' : (Math.round(v*10)/10).toString();

/* ───────── 状態 ───────── */
let state = { tab:'start', item:null };
try { const s = JSON.parse(localStorage.getItem('wa.ui')); if (s) state = s; } catch {}
const saveUi = () => { try { localStorage.setItem('wa.ui', JSON.stringify(state)); } catch {} };

const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs={}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };

/* ───────── タブ ───────── */
const TABS = [{id:'start',en:'START',ja:'全体'}, ...LAYERS];
function renderTabs(){
  const nav = $('#tabs'); nav.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.role = 'tab';
    b.setAttribute('aria-selected', state.tab === t.id);
    b.innerHTML = `${t.en}<small>${t.ja}</small>`;
    b.onclick = () => select(t.id);
    nav.appendChild(b);
  });
}

function select(tab, item){
  state.tab = tab;
  if (item !== undefined) state.item = item;
  else if (tab !== 'start') { const L = LAYERS.find(l=>l.id===tab); if (!state.item || ITEMS[state.item]?.layer !== L) state.item = L.items[0].id; }
  else state.item = null;
  saveUi(); render();
}

/* ───────── 輪 ───────── */
function renderRings(){
  const svg = $('#rings'); svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  LAYERS.forEach(L => {
    const on = state.tab === 'start' || state.tab === L.id;
    const c = css(L.color);
    el('circle', {cx:100, cy:100, r:L.r, class:'ring'+(on?' on':''), stroke:c, style:`color:${c}`}, svg);
    // 弧の上にラベル
    const p = el('path', {id:'lp-'+L.id, d:`M ${100-L.r+3} 100 A ${L.r-3} ${L.r-3} 0 0 1 ${100+L.r-3} 100`, fill:'none'}, defs);
    const t = el('text', {class:'ring-label'+(on?' on':'')}, svg);
    const tp = el('textPath', {href:'#lp-'+L.id, startOffset:'50%', 'text-anchor':'middle'}, t);
    tp.textContent = L.en;
    const hit = el('circle', {cx:100, cy:100, r:L.r, class:'ring-hit'}, svg);
    const title = el('title', {}, hit); title.textContent = `${L.en} ・ ${L.ja}`;
    hit.addEventListener('click', () => select(L.id));
  });
  // 中心の紋章
  const g = el('g', {transform:'translate(100 100) scale(.11) translate(-100 -120)', class:'mark'}, svg);
  el('path', {d:'M100 18 L100 64 M100 64 C100 94 72 115 44 143 C26 161 37 187 62 187 C81 187 91 173 100 157 C109 173 119 187 138 187 C163 187 174 161 156 143 C128 115 100 94 100 64 M45 143 L155 143 M100 157 L100 218 M76 214 Q100 232 124 214', 'stroke-width':10}, g);

  const s = state.tab === 'start' ? avg(LAYERS.map(layerScore)) : layerScore(LAYERS.find(l=>l.id===state.tab));
  const label = state.tab === 'start' ? 'WHOLE' : LAYERS.find(l=>l.id===state.tab).en;
  $('#stageScore').innerHTML = `${label} &nbsp;<b>${fmt(s)}</b> / 10`;
}

/* ───────── リスト ───────── */
function scoreDot(v, color){
  const svg = document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 42 42'); svg.classList.add('dot');
  const C = 2*Math.PI*17;
  el('circle',{cx:21,cy:21,r:17,stroke:'rgba(255,255,255,.08)','stroke-width':3},svg);
  el('circle',{cx:21,cy:21,r:17,stroke:color,'stroke-width':3,'stroke-linecap':'round',
    'stroke-dasharray':`${C*(v??0)/10} ${C}`, transform:'rotate(-90 21 21)'},svg);
  const t = el('text',{x:21,y:25,'text-anchor':'middle','font-size':11,fill:'#e7dfd1'},svg); t.textContent = v==null?'':Math.round(v);
  return svg;
}
function renderList(){
  const ul = $('#items'); ul.innerHTML = '';
  const start = state.tab === 'start';
  $('#listTitle').textContent = start ? 'LAYERS ・ 層' : `${LAYERS.find(l=>l.id===state.tab).en} ・ ITEMS`;
  const rows = start
    ? LAYERS.map(L => ({key:L.id, en:L.en, ja:L.ja, v:layerScore(L), color:css(L.color), go:() => select(L.id), cur:false}))
    : LAYERS.find(l=>l.id===state.tab).items.map(i => ({key:i.id, en:i.en, ja:i.ja, v:latest(i.id), color:css(i.layer.color), go:() => select(state.tab, i.id), cur:state.item===i.id}));
  rows.forEach(r => {
    const li = document.createElement('li'); li.className = 'item'; li.tabIndex = 0;
    li.setAttribute('aria-current', r.cur);
    li.appendChild(scoreDot(r.v, r.color));
    li.insertAdjacentHTML('beforeend', `<div class="name">${r.en}<small>${r.ja}</small></div><div class="val">${fmt(r.v)}</div><div class="bar"><i style="width:${(r.v??0)*10}%;background:${r.color}"></i></div>`);
    li.onclick = r.go; li.onkeydown = e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); r.go(); } };
    ul.appendChild(li);
  });
}

/* ───────── レーダー ───────── */
function renderRadar(){
  const svg = $('#radar'); svg.innerHTML = '';
  const start = state.tab === 'start';
  const axes = start ? LAYERS.map(L => ({label:L.en, v:layerScore(L)}))
                     : LAYERS.find(l=>l.id===state.tab).items.map(i => ({label:i.en, v:latest(i.id)}));
  const n = axes.length, cx = 100, cy = 100, R = 82;
  const pt = (i, r) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; };
  [2,4,6,8,10].forEach(s => el('polygon',{class:'web', points:axes.map((_,i)=>pt(i,R*s/10).join(',')).join(' ')},svg));
  axes.forEach((a,i) => {
    const [x,y] = pt(i,R); el('line',{class:'axis',x1:cx,y1:cy,x2:x,y2:y},svg);
    const [lx,ly] = pt(i,R+14);
    const t = el('text',{x:lx,y:ly+3,'text-anchor': Math.abs(lx-cx)<4?'middle':(lx>cx?'start':'end')},svg); t.textContent = a.label;
  });
  el('polygon',{class:'shape', points:axes.map((a,i)=>pt(i,R*(a.v??0)/10).join(',')).join(' ')},svg);
  axes.forEach((a,i) => { const [x,y] = pt(i,R*(a.v??0)/10); el('circle',{cx:x,cy:y,r:2.2,fill:'var(--accent)'},svg); });
}

/* ───────── 詳細 ───────── */
function renderDetail(){
  const box = $('#detail');
  if (state.tab === 'start' || !state.item){
    const L = state.tab==='start' ? null : LAYERS.find(l=>l.id===state.tab);
    box.innerHTML = `<div class="detail-head"><h3>輪</h3><span>A LIVING CIRCLE</span></div>
      <p>外側から 体 → 脳 → 心 → 魂。輪の層かタブを選ぶと、その層の項目が右に並ぶ。<br>項目を選んで、今日の状態を 0〜10 で記録する。蛇は自分の尾を噛み、輪は毎日めぐる。</p>
      ${L?'':`<div class="bars">${LAYERS.map(L=>{const v=layerScore(L);return `<div title="${L.en} ${fmt(v)}"><i class="${v==null?'empty':''}" style="height:${(v??0)*10}%;background:${css(L.color)}"></i></div>`}).join('')}</div>
      <div class="bar-days">${LAYERS.map(L=>`<span>${L.ja}</span>`).join('')}</div>`}`;
    return;
  }
  const it = ITEMS[state.item], days = lastDays(14), r = records[it.id] || {};
  const cur = r[TODAY] ?? latest(it.id) ?? 5;
  box.innerHTML = `
    <div class="detail-head"><h3>${it.en}</h3><span>${it.ja} ・ ${it.layer.en}</span></div>
    <p>${it.desc}</p>
    <div class="bars">${days.map(d => { const v = r[d]; return `<div class="${d===TODAY?'today':''}" title="${d} : ${v??'記録なし'}"><i class="${v==null?'empty':''}" style="height:${(v??0)*10}%"></i></div>`; }).join('')}</div>
    <div class="bar-days">${days.map(d => `<span>${+d.slice(8)}</span>`).join('')}</div>
    <div class="record">
      <label for="score">TODAY</label>
      <input type="range" id="score" min="0" max="10" step="1" value="${cur}">
      <output id="scoreOut">${cur}</output>
      <button class="btn primary" id="save" type="button">記録する</button>
      <span class="saved" id="saved">記録した</span>
    </div>`;
  const input = $('#score'), out = $('#scoreOut');
  input.oninput = () => out.textContent = input.value;
  $('#save').onclick = () => {
    (records[it.id] ??= {})[TODAY] = +input.value; persist(); render();
    const s = $('#saved'); s.classList.add('show'); setTimeout(()=>s.classList.remove('show'), 1400);
  };
}

/* ───────── 全体描画 ───────── */
function render(){
  const L = LAYERS.find(l=>l.id===state.tab);
  document.documentElement.style.setProperty('--accent', L ? css(L.color) : css('--gold'));
  renderTabs(); renderRings(); renderList(); renderRadar(); renderDetail();
}

$('#sample').onclick = () => {
  lastDays(14).forEach((d,k) => Object.keys(ITEMS).forEach((id,j) => {
    (records[id] ??= {})[d] = Math.max(0, Math.min(10, Math.round(5 + 3*Math.sin(k/2 + j) + (j%3) - 1)));
  }));
  persist(); render();
};
$('#clear').onclick = () => { if (confirm('すべての記録を消す？')) { records = {}; persist(); render(); } };

render();
</script>
</body>
</html>
