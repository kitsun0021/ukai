<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090b">
  <title>輪 — 動く絵</title>
  <style>
/* No network font requests: works fully offline. */
:root{color-scheme:dark;--bg:#08090b;--gold:#b99a6a;--muted:#77736d}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:#eee}
body{font-family:serif;overflow-x:hidden}
.stage{width:100%;max-width:100vw;height:100svh;min-height:0;position:relative;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:radial-gradient(ellipse at center,#161412 0%,#0c0b0c 43%,#08090b 76%)}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.48) 100%);z-index:-1}
.grain{position:absolute;inset:-50%;opacity:.09;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.35'/%3E%3C/svg%3E");animation:grain .25s steps(2) infinite}
@keyframes grain{0%{transform:translate(0,0)}50%{transform:translate(2%,-1%)}100%{transform:translate(-1%,2%)}}
.artwork{margin:0;width:min(84vw,64svh,620px);max-width:100%;aspect-ratio:1;display:grid;place-items:center;position:relative;filter:drop-shadow(0 0 34px rgba(190,145,79,.1));animation:float 8s ease-in-out infinite}
.artwork img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;opacity:.94;animation:snake-breathe 9s ease-in-out infinite;transform-origin:center;}
.lucifer-mark{position:absolute;width:25%;height:30%;left:50%;top:50%;transform:translate(-50%,-50%);fill:none;stroke:#c5a568;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;opacity:.68;filter:drop-shadow(0 0 7px rgba(204,158,80,.42));pointer-events:none;animation:mark-glow 5s ease-in-out infinite}
@keyframes mark-glow{0%,100%{opacity:.48;filter:drop-shadow(0 0 4px rgba(204,158,80,.25))}50%{opacity:.82;filter:drop-shadow(0 0 11px rgba(204,158,80,.55))}}
@keyframes snake-breathe{0%,100%{transform:scale(.985) rotate(-.35deg);filter:brightness(.94) saturate(.98)}50%{transform:scale(1.015) rotate(.35deg);filter:brightness(1.09) saturate(1.07)}}
@keyframes float{0%,100%{transform:translateY(5px) rotate(-.5deg)}50%{transform:translateY(-7px) rotate(.5deg)}}
.title{position:absolute;top:max(30px,env(safe-area-inset-top));left:clamp(22px,5vw,70px);display:flex;align-items:center;gap:13px;font-size:18px;letter-spacing:.28em;color:#e7dfd1}
.sigil{font-family:serif;color:var(--gold);font-size:20px}
.controls{position:absolute;right:clamp(18px,4vw,56px);bottom:clamp(35px,8vh,90px);display:flex;flex-direction:column;gap:14px}
button{width:46px;height:46px;border-radius:50%;border:1px solid rgba(215,194,155,.45);background:rgba(16,15,15,.35);color:#eee;font-size:18px;cursor:pointer;backdrop-filter:blur(10px);transition:background .2s,transform .2s}
button:hover{background:rgba(185,154,106,.24);transform:scale(1.06)}
.caption{position:absolute;left:clamp(22px,5vw,70px);bottom:clamp(38px,8vh,88px);display:flex;flex-direction:column;gap:7px;color:var(--muted);font:11px serif;letter-spacing:.22em}
.caption span:last-child{font:10px sans-serif;letter-spacing:.12em;color:#a49a88}
@media(max-width:600px){.artwork{width:min(88vw,57svh)}.title{top:24px;left:22px;font-size:16px}.controls{right:18px;bottom:max(28px,env(safe-area-inset-bottom))}.caption{left:22px;bottom:max(34px,env(safe-area-inset-bottom))}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}

  
.paused .grain,.paused .artwork,.paused .artwork img,.paused .lucifer-mark{animation-play-state:paused!important}
</style>
</head>

const stage = document.querySelector('.stage');
const toggle = document.getElementById('toggle');
const toggleIcon = document.getElementById('toggleIcon');
let playing = true;
